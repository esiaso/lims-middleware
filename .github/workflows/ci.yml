name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: lims_test
          POSTGRES_PASSWORD: lims_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U lims_test" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      LIMS_TEST_PG: Host=localhost;Username=lims_test;Password=lims_test;Database=postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: dotnet build -c Release
      - run: dotnet test -c Release --no-build --logger "trx" --results-directory TestResults
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: TestResults
